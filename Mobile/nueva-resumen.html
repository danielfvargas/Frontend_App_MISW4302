<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmar alarma</title>
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<div class="phone">
  <div class="bg-layer">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div class="screen">
    <div class="header with-back">
      <a class="back-btn" href="nueva-configurar.html">
        <svg class="icon" viewBox="0 0 24 24" width="14" height="14"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <h1>Confirmar alarma</h1>
    </div>

    <div class="card summary-card">
      <div class="summary-head">
        <span class="alarm-icon">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 3c-1.5 2-3 3.5-3 6a3 3 0 0 0 6 0c0-1-.3-1.8-.8-2.6.6.4 2.8 2.3 2.8 5.6a5 5 0 0 1-10 0c0-4.3 3.4-7.3 5-9z"/></svg>
        </span>
        <h3>Vitaminas ya!</h3>
      </div>
      <div class="summary-row"><span>Dosis</span><span>1 tableta</span></div>
      <div class="summary-row"><span>Frecuencia</span><span>Diario</span></div>
      <div class="summary-row"><span>Hora</span><span>07:00 am</span></div>
    </div>

    <a class="btn btn-primary" href="index.html">Guardar y activar</a>
    <a class="btn-text" href="index.html">Cancelar</a>
  </div>
</div>
</body>
</html>
