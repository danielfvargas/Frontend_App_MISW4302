<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historial</title>
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<div class="phone">
  <div class="bg-layer">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div class="screen">
    <div class="header with-back">
      <a class="back-btn" href="detalle.html">
        <svg class="icon" viewBox="0 0 24 24" width="14" height="14"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <h1>Historial</h1>
    </div>

    <div class="hist-kpis">
      <div class="card hist-kpi">
        <svg class="icon" viewBox="0 0 24 24" style="color:var(--mint-300)"><path d="M12 3c-1.5 2-3 3.5-3 6a3 3 0 0 0 6 0c0-1-.3-1.8-.8-2.6.6.4 2.8 2.3 2.8 5.6a5 5 0 0 1-10 0c0-4.3 3.4-7.3 5-9z"/></svg>
        <p class="num">5</p>
        <p class="label">Racha actual</p>
      </div>
      <div class="card hist-kpi">
        <svg class="icon" viewBox="0 0 24 24" style="color:var(--amber)"><path d="M12 3c-1.5 2-3 3.5-3 6a3 3 0 0 0 6 0c0-1-.3-1.8-.8-2.6.6.4 2.8 2.3 2.8 5.6a5 5 0 0 1-10 0c0-4.3 3.4-7.3 5-9z"/></svg>
        <p class="num">12</p>
        <p class="label">Racha m&aacute;s larga</p>
      </div>
    </div>

    <p class="cal-head">Agosto 2026</p>
    <div class="cal-grid">
      <div class="dow">L</div><div class="dow">M</div><div class="dow">M</div><div class="dow">J</div><div class="dow">V</div><div class="dow">S</div><div class="dow">D</div>
    </div>
    <div class="cal-grid">
      <div class="cal-day ok">1</div><div class="cal-day ok">2</div><div class="cal-day ok">3</div><div class="cal-day ok">4</div><div class="cal-day fail">5</div><div class="cal-day ok">6</div><div class="cal-day ok">7</div>
      <div class="cal-day ok">8</div><div class="cal-day ok">9</div><div class="cal-day fail">10</div><div class="cal-day ok">11</div><div class="cal-day ok">12</div><div class="cal-day ok">13</div><div class="cal-day ok">14</div>
      <div class="cal-day fail">15</div><div class="cal-day ok">16</div><div class="cal-day ok">17</div><div class="cal-day ok">18</div><div class="cal-day ok">19</div><div class="cal-day fail">20</div><div class="cal-day ok">21</div>
      <div class="cal-day ok">22</div><div class="cal-day ok">23</div><div class="cal-day ok">24</div><div class="cal-day fail">25</div><div class="cal-day ok">26</div><div class="cal-day ok">27</div><div class="cal-day ok">28</div>
      <div class="cal-day ok">29</div><div class="cal-day fail">30</div><div class="cal-day ok">31</div>
    </div>

    <div class="legend">
      <span><span class="dot ok"></span> Cumplido</span>
      <span><span class="dot fail"></span> Fallado</span>
    </div>

    <a class="btn btn-secondary" href="detalle.html">Volver al detalle</a>
  </div>
</div>
</body>
</html>
