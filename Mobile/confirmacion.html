<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrado</title>
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<div class="phone">
  <div class="bg-layer">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <a class="close-x" href="index.html" aria-label="Cerrar">
    <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </a>
  <div class="screen" style="padding-top:60px">
    <div class="check-circle">
      <svg class="icon" viewBox="0 0 24 24" width="30" height="30" style="stroke-width:3"><path d="M5 13l4 4L19 7"/></svg>
    </div>
    <div class="center-title">
      <h1>&iexcl;Registrado!</h1>
      <p>Tomaste tu dosis a las 07:03 am</p>
    </div>

    <div class="card streak-card">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 3c-1.5 2-3 3.5-3 6a3 3 0 0 0 6 0c0-1-.3-1.8-.8-2.6.6.4 2.8 2.3 2.8 5.6a5 5 0 0 1-10 0c0-4.3 3.4-7.3 5-9z"/></svg>
      <p class="num">5 d&iacute;as seguidos</p>
    </div>

    <div class="motiv-banner">&iexcl;Vas muy bien, sigue as&iacute;!</div>

    <a class="btn btn-secondary" href="index.html">Volver a mis alarmas</a>
  </div>
</div>
</body>
</html>
