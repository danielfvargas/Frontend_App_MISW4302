<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Alarmas de salud</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob-3" aria-hidden="true"></div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-mark">
        <svg class="icon" viewBox="0 0 24 24" width="26" height="26">
          <path d="M6 11c0-3.3 2.7-6 6-6s6 2.7 6 6v3l1.5 2.5h-15L6 14z"/>
          <path d="M10 19a2 2 0 0 0 4 0"/>
        </svg>
      </div>
      <h1>Iniciar sesión</h1>
      <p class="login-sub">Webapp de administración</p>

      <div class="field">
        <label for="usuario">Usuario</label>
        <input id="usuario" type="text" placeholder="correo@ejemplo.com">
      </div>
      <div class="field">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" placeholder="********">
      </div>
      <a class="forgot" href="#">Recuperar contraseña</a>
      <a class="btn btn-primary" href="dashboard.html">Ingresar</a>
    </div>
  </div>
</body>
</html>
