<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Alarmas de salud</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob-3" aria-hidden="true"></div>
  <nav class="navbar">
    <a class="navbar-brand" href="dashboard.html">
      <div class="login-mark">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18">
          <path d="M6 11c0-3.3 2.7-6 6-6s6 2.7 6 6v3l1.5 2.5h-15L6 14z"/>
          <path d="M10 19a2 2 0 0 0 4 0"/>
        </svg>
      </div>
      <div>
        <div class="name">Alarmas de salud</div>
        <div class="sub">Admin</div>
      </div>
    </a>
    <div class="navbar-user">
      Mamá de Alex
      <span class="avatar">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16">
          <circle cx="12" cy="8" r="3.2"/>
          <path d="M5.5 19c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/>
        </svg>
      </span>
    </div>
  </nav>

  <main class="page">
    <h1>Bienvenido</h1>
    <p class="page-sub">Racha actual y resumen rápido de Vitaminas ya!</p>

    <div class="kpi-row">
      <div class="card kpi-card">
        <div class="num">
          <svg class="icon" viewBox="0 0 24 24" style="color:var(--mint-300)">
            <path d="M12 3c-1.5 2-3 3.5-3 6a3 3 0 0 0 6 0c0-1-.3-1.8-.8-2.6.6.4 2.8 2.3 2.8 5.6a5 5 0 0 1-10 0c0-4.3 3.4-7.3 5-9z"/>
          </svg>
          5
        </div>
        <div class="label">Racha actual (días)</div>
      </div>
      <div class="card kpi-card">
        <div class="num">
          <svg class="icon" viewBox="0 0 24 24" style="color:var(--amber)">
            <path d="M12 3c-1.5 2-3 3.5-3 6a3 3 0 0 0 6 0c0-1-.3-1.8-.8-2.6.6.4 2.8 2.3 2.8 5.6a5 5 0 0 1-10 0c0-4.3 3.4-7.3 5-9z"/>
          </svg>
          12
        </div>
        <div class="label">Racha más larga (días)</div>
      </div>
      <div class="card kpi-card">
        <div class="num">92%</div>
        <div class="label">Adherencia (30 días)</div>
      </div>
    </div>

    <div class="card activity-card">
      <div>
        <h3>Actividad reciente</h3>
        <p>Última dosis confirmada hoy 07:03 am - Vitaminas ya!</p>
      </div>
      <a href="historial.html">Ver historial completo</a>
    </div>
  </main>
</body>
</html>
